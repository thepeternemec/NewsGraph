name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (contracts → sdk → apps)
        run: npm run build

      - name: Test
        run: npm test

      - name: News integration contracts (local fixtures)
        run: npm run verify:local

      - name: Supabase _shared drift check
        run: npm run check:supabase

  deno-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Edge Functions
        run: deno check --no-config --no-lock --node-modules-dir=none supabase/functions/api/index.ts supabase/functions/worker/index.ts supabase/functions/news-worker/index.ts supabase/functions/news-api/index.ts
